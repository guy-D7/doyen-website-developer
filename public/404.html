<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Doyen Website Developer</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#141414;font-family:'Archivo',Arial,sans-serif;padding:24px}
  main{max-width:640px;text-align:center}
  .me{width:180px;margin:0 auto 8px;position:relative}
  .bubble{position:absolute;left:-96px;top:12px;background:#141414;color:#fff;font-weight:700;font-size:15px;padding:8px 12px;border-radius:14px 14px 2px 14px;transform:rotate(-6deg)}
  .code{font-stretch:62.5%;font-weight:900;font-size:clamp(96px,22vw,180px);line-height:.85;letter-spacing:-.02em}
  .code span{color:#D62828}
  h1{font-size:clamp(22px,4vw,32px);margin:18px 0 10px}
  p{color:#525252;font-size:17px;line-height:1.6}
  nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
  a{display:inline-block;padding:13px 20px;font-weight:700;font-size:15px;text-decoration:none;border:2px solid #141414;color:#141414}
  a.primary{background:#D62828;border-color:#D62828;color:#fff;box-shadow:4px 4px 0 #141414}
  a:hover{background:#141414;color:#fff;border-color:#141414}
</style>
</head>
<body>
<main>
  <div class="me"><span class="bubble">Oops!</span><img src="/assets/mascot.svg" alt="" width="180" height="198"></div>
  <p class="code">4<span>0</span>4</p>
  <h1>This page took a wrong turn.</h1>
  <p>The link may be old or mistyped. Here's where you probably wanted to go:</p>
  <nav>
    <a class="primary" href="/">Home</a>
    <a href="/portfolio">Live Projects</a>
    <a href="/services">Services</a>
    <a href="/contact">Contact</a>
  </nav>
</main>
</body>
</html>
